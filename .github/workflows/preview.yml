# Publishes ONLY doc/mockups to GitHub Pages.
#
# Deliberately not "Pages from a branch": that serves the whole repo, which
# would put PLAN.md, TASKS.md and STORIES.md on the public web.
#
# This is the temporary preview deploy. When the Astro site lands, replace
# this file with the real deploy.yml from PLAN.md §11.1 and drop the
# robots.txt block below.
name: Preview mockups

on:
  push:
    branches: [main]
    paths:
      - 'doc/mockups/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp doc/mockups/*.html _site/

          # the old four-directions page keeps a home, but not the index slot
          if [ -f _site/index.html ]; then mv _site/index.html _site/directions.html; fi

          # / lands on the homepage mockup
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en-IN">
          <head>
            <meta charset="utf-8">
            <title>Jadauco — mockups</title>
            <meta http-equiv="refresh" content="0; url=./final-home.html">
            <link rel="canonical" href="./final-home.html">
          </head>
          <body>
            <p>Redirecting to the <a href="./final-home.html">homepage mockup</a>.</p>
          </body>
          </html>
          HTML

          # These are mockups. Keep them out of Google entirely — the SEO plan
          # depends on the real pages being the first thing indexed at this
          # domain, not placeholder copy that later gets deleted.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

          # CUSTOM DOMAIN. Must match Settings > Pages > Custom domain exactly.
          # For Actions-based Pages the CNAME has to ship inside the artifact —
          # without it the custom-domain setting is cleared on the next deploy
          # and the site silently falls back to cloudalgo.github.io.
          echo 'jadauco.com' > _site/CNAME

          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
