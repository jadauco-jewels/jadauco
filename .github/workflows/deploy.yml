name: Deploy site

# PLAN.md §11.1. This replaces preview.yml, which published only doc/mockups.
#
# The chain the client sees is sheet → sync → commit → deploy → live, and the last
# link cannot be a push event. GitHub deliberately does not start a workflow from an
# event created with the default GITHUB_TOKEN, so the commit the sync makes lands on
# main and triggers nothing — the site sat on the previous build until someone ran
# this by hand. `workflow_call` is how the sync reaches it: a job dependency rather
# than an event, so the suppression does not apply and no extra credential is needed.
on:
  push:
    branches: [main]
    # Only the directories that genuinely cannot affect the built site. Note
    # what is NOT here: markdown. `src/content/**` is almost entirely .md, and
    # those are the files the sync commits — ignoring them would break the
    # sheet → sync → deploy chain at its last link. (`paths-ignore` has no
    # negation, so this list has to be conservative rather than clever.)
    paths-ignore:
      - 'doc/**'
      - 'brand-kit/**'
      - 'tools/**'
      - 'CONTRIBUTING-FOR-CLIENT.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Unlike the sync, a superseded deploy is worth
# cancelling: the newer commit contains everything the older one did.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The branch tip, not `github.sha`. When the sync calls this workflow, the github context
      # is the caller's — and the caller started *before* the sync committed, so the default
      # checkout would build the tree as it was and deploy the previous catalogue. Taking the
      # tip is also right for a plain push: if two land at once, the newer contains the older,
      # which is the same reasoning the concurrency block above already runs on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # astro check runs the content schemas — the §5.8 backstop that stops a
      # broken sync from reaching the web even if it reached git.
      - run: npx astro check

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
